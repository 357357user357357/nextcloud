; Effective (non-comment) settings from /etc/php/8.5/fpm/pool.d/www.conf on the relay.
; Everything else is stock Ubuntu 26.04.

[www]
user = www-data
group = www-data
listen = /run/php/php8.5-fpm.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
